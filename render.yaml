services:
  - type: web
    name: northstar-paper-trading-dashboard
    runtime: static
    buildCommand: "echo 'Publishing static dashboard'"
    staticPublishPath: ./trading_system/webapp
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Cache-Control
        value: no-store
